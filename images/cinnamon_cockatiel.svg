<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
    <defs>
        <linearGradient id="bg-grad-cinnamon_cockatiel" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8B4513" />
            <stop offset="100%" stop-color="#D2B48C" />
        </linearGradient>
        <filter id="glow-cinnamon_cockatiel" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="15" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    <!-- Background -->
    <rect width="600" height="400" fill="url(#bg-grad-cinnamon_cockatiel)" />
    <!-- Decorative Circles -->
    <circle cx="500" cy="80" r="180" fill="#FFD700" opacity="0.15" />
    <circle cx="100" cy="320" r="140" fill="#ffffff" opacity="0.1" />
    <path d="M 0 300 Q 300 200 600 350 L 600 400 L 0 400 Z" fill="#ffffff" opacity="0.08" />
    <!-- Branch Silhouette -->
    <path d="M 80 270 Q 250 250 520 280 T 600 270" stroke="#4a3728" stroke-width="14" stroke-linecap="round" fill="none" />
    <!-- Bird Icon Overlay -->
    <circle cx="300" cy="170" r="75" fill="#ffffff" opacity="0.2" filter="url(#glow-cinnamon_cockatiel)" />
    <text x="300" y="195" font-size="90" text-anchor="middle" dominant-baseline="middle">🐥</text>
    <!-- Species Badge -->
    <rect x="50" y="310" width="500" height="60" rx="18" fill="rgba(0,0,0,0.5)" stroke="#FFD700" stroke-width="2" />
    <text x="300" y="348" font-family="'Montserrat', sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">Cinnamon Cockatiel</text>
</svg>